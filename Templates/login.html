<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в панель экологического контроля</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf4f0; color: #1c3127; font: 16px system-ui, sans-serif; }
        main { width: min(360px, 84vw); padding: 28px; background: white; border-radius: 12px; box-sizing: border-box; box-shadow: 0 8px 35px #1734261a; }
        h1 { margin: 0 0 22px; font-size: 24px; }
        form { display: grid; gap: 14px; }
        label { display: grid; gap: 6px; }
        input, button { padding: 10px; border-radius: 6px; font: inherit; }
        input { border: 1px solid #81978b; }
        button { border: 0; background: #176343; color: white; cursor: pointer; }
        [role=alert] { color: #a82323; }
    </style>
</head>
<body>
    <main>
        <h1>Вход оператора</h1>
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        <form action="/login" method="post">
            <input type="hidden" name="csrf" value="{{ request.session.csrf }}">
            <label>Логин <input name="username" autocomplete="username" required autofocus></label>
            <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Войти</button>
        </form>
    </main>
</body>
</html>
